name: Update Proxies

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run script
        run: npm start
      - name: Commit changes
        run: |
          git config --local user.email "tianndev-proxy-bot@users.noreply.github.com"
          git config --local user.name "tianndev-proxy-bot"
          git add proxy/
          MSG=$(cat commit_msg.txt)
          git commit -m "$MSG" || exit 0
          git push
